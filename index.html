// ═══════════════════════════════════════
// SCRAPERS — one per auction house, plus a generic fallback
// ═══════════════════════════════════════
// Pages are read through the r.jina.ai reader (it fetches the page server-side,
// so we avoid the auction sites' CORS rules). Every scraper has the same shape:
//   id, house        — identifiers
//   matches(url)     — true if this scraper handles the URL
//   format           — 'markdown' (the reader's text version of the page) or
//                      'html' (the raw page, for sites whose data is embedded
//                      as JSON and never appears in the text version)
//   fromUrl(url)     — optional: fields readable from the URL alone, used even
//                      when the site blocks the reader
//   parse(page, url) — page = { title, content, html, meta }
//   noGenericFallback — optional: don't top up blanks with the generic parser
//                      (for pages where it is known to grab the wrong lot)
// Every scraper returns the shape built by emptyScrape().

function emptyScrape() {
  return {
    lot:     { name:'', lotNumber:'', estimate:'', hammerPrice:'', description:'', lotImageUrl:'' },
    auction: { name:'', house:'', date:'', url:'' },
  };
}

// Fill blank fields in `into` from `from` (never overwrites).
function mergeScrape(into, from) {
  for (const part of ['lot','auction']) {
    for (const k of Object.keys(into[part])) {
      if (!into[part][k] && from?.[part]?.[k]) into[part][k] = from[part][k];
    }
  }
  return into;
}

const MONTHS = {january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12',
  jan:'01',feb:'02',mar:'03',apr:'04',jun:'06',jul:'07',aug:'08',sep:'09',sept:'09',oct:'10',nov:'11',dec:'12'};

// Parses "20 November 2026", "November 19, 2026", "Nov 19" (+ fallbackYear) or
// "2026-11-19" into "2026-11-19". Returns '' if nothing usable.
function parseLooseDate(str, fallbackYear) {
  if (!str) return '';
  let m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const mon = '(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sept?(?:ember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)';
  m = str.match(new RegExp(`(\\d{1,2})\\s+${mon}\\.?,?\\s+(\\d{4})`, 'i'));
  if (m) return `${m[3]}-${MONTHS[m[2].toLowerCase()]}-${m[1].padStart(2,'0')}`;
  m = str.match(new RegExp(`${mon}\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?`, 'i'));
  if (m && (m[3] || fallbackYear)) return `${m[3]||fallbackYear}-${MONTHS[m[1].toLowerCase()]}-${m[2].padStart(2,'0')}`;
  return '';
}

function decodeEntities(s) {
  const named = { amp:'&', lt:'<', gt:'>', quot:'"', apos:"'", nbsp:' ', rsquo:'’', lsquo:'‘', rdquo:'”', ldquo:'“', ndash:'–', mdash:'—', hellip:'…' };
  return String(s||'')
    .replace(/&#x([0-9a-f]+);/gi, (_,h) => String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g, (_,d) => String.fromCodePoint(parseInt(d,10)))
    .replace(/&([a-z]+);/gi, (m,n) => named[n.toLowerCase()] ?? m);
}

// HTML -> plain text, one block element per line.
function htmlToText(html) {
  return decodeEntities(String(html||'')
    .replace(/<(script|style|svg|noscript)[\s\S]*?<\/\1>/gi, '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h\d|span|tr|section)>/gi, '\n')
    .replace(/<[^>]+>/g, ''))
    .split('\n').map(l => l.replace(/[ \t ]+/g,' ').trim()).filter(Boolean).join('\n');
}

// Value on the line after a standalone label, e.g. "Estimate\n\n$300,000–500,000".
function valueAfterLabel(text, label) {
  const m = String(text||'').match(new RegExp(`(?:^|\\n)[ \\t]*${label}[ \\t]*:?[ \\t]*\\n+[ \\t]*([^\\n]+)`, 'i'));
  return m ? m[1].trim() : '';
}

// "BEN ENWONWU" -> "Ben Enwonwu"; leaves mixed-case text alone.
function titleCaseIfCaps(s) {
  s = String(s||'').trim();
  if (!s || s !== s.toUpperCase() || !/[A-Z]/.test(s)) return s;
  const small = new Set(['a','an','and','at','by','de','del','der','des','di','du','for','in','la','le','of','on','or','the','to','van','von','with']);
  return s.toLowerCase().replace(/[\p{L}\p{N}']+/gu, (w, i) =>
    (i > 0 && small.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1));
}

// The app's naming convention is "Artist — Title" (the Pipeline tiles split on it).
function joinArtistTitle(artist, title) {
  artist = String(artist||'').trim(); title = String(title||'').trim();
  if (artist && title && artist.toLowerCase() !== title.toLowerCase()) return `${artist} — ${title}`;
  return artist || title;
}

// Pulls one complete JSON object out of a larger string, starting at `start`
// (which must point at its opening brace). String-aware brace matching.
function extractJsonAt(text, start) {
  if (start < 0 || text[start] !== '{') return null;
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{') depth++;
    else if (c === '}') { depth--; if (depth === 0) { try { return JSON.parse(text.slice(start, i+1)); } catch(e) { return null; } } }
  }
  return null;
}

function slugToWords(slug) {
  return titleCaseIfCaps(decodeURIComponent(String(slug||'')).replace(/[-_]+/g,' ').trim().toUpperCase());
}

// French/German catalogues put surnames in caps ("Ablade GLOVER"):
// capitalise just the all-caps words, keeping company suffixes as they are.
function fixCapsWords(s) {
  const keep = new Set(['SAS','SARL','SVV','SA','GMBH','KG','LLC','LTD','INC','AG','BV','NV','II','III','IV']);
  return String(s||'').replace(/\p{Lu}[\p{Lu}'’-]+/gu, w => keep.has(w) ? w : w.charAt(0) + w.slice(1).toLowerCase());
}

// "Tuesday, November 24" / "December 10" (no year): picks the year whose
// weekday matches if one is given, else the next occurrence (allowing for
// sales up to ~4 months back).
function parseDateNoYear(str) {
  const withYear = parseLooseDate(str);
  if (withYear && /\b\d{4}\b/.test(str)) return withYear;
  const now = new Date(), y = now.getFullYear();
  const wd = (String(str).match(/\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat)[a-z]*\b/i) || [])[1];
  const days = ['sun','mon','tue','wed','thu','fri','sat'];
  const at = yr => { const d = parseLooseDate(str, yr); return d ? { d, t: new Date(d+'T12:00:00') } : null; };
  if (wd) {
    for (const yr of [y, y+1, y-1]) { const c = at(yr); if (c && days[c.t.getDay()] === wd.toLowerCase().slice(0,3)) return c.d; }
  }
  const c = at(y); if (!c) return '';
  return (c.t.getTime() < now.getTime() - 120*86400000) ? at(y+1).d : c.d;
}

// Best lot image: declared share image, else the highest-scoring inline
// image. `hint` (e.g. the item id) boosts images whose URL contains it.
function pickImage(page, hint) {
  const declared = page.meta['og:image'] || page.meta['twitter:image'] || '';
  if (declared && !hint) return declared;
  const imgs = []; const pat = /!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g; let m;
  while ((m = pat.exec(page.content || '')) !== null) imgs.push({ u: m[2], alt: m[1] });
  const scored = imgs.map(({u, alt}) => {
    let s = 0;
    if (hint && u.includes(hint)) s += 30;
    if (u.match(/\.(jpg|jpeg|png|webp)/i)) s += 10;
    if (u.match(/lot|artwork|object|item|figure|painting|work/i)) s += 8;
    if (u.match(/thumbnail|thumb|icon|logo|avatar|banner|sprite|pixel|social|favicon/i)) s -= 15;
    if (alt.match(/lot|artwork|painting|sculpture/i)) s += 5;
    if (alt.match(/logo|icon|social/i)) s -= 10;
    return { u, s };
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  return (hint && scored[0]?.u.includes(hint)) ? scored[0].u : (declared || scored[0]?.u || '');
}

// Text of a markdown link: "[AZ Auction](https://…)" -> "AZ Auction".
function linkText(s) { return String(s||'').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').trim(); }

// "Prince Twins Seven Seven (Nigeria, 1944-2011) \"Stick Dancers\"" ->
// "Prince Twins Seven Seven — Stick Dancers". Leaves other shapes alone.
function splitArtistParens(s) {
  const m = String(s||'').match(/^([^()]+?)\s*\([^)]*\)\s*(.*)$/);
  if (!m) return String(s||'').trim();
  return joinArtistTitle(m[1], m[2].replace(/^[,.\s"“”']+|["“”'\s]+$/g, ''));
}

function formatMoney(sym, n) { return n ? `${sym||''}${Number(n).toLocaleString('en-GB')}` : ''; }

// ── Christie's ──
// The reader's text version of a Christie's lot page only contains the
// "More from this sale" carousel (other lots' estimates!), so we read the raw
// HTML instead: it embeds the lot and sale as JSON.
const christiesScraper = {
  id: 'christies', house: "Christie's", format: 'html', noGenericFallback: true,
  matches: url => /(^|\.)christies\.com$/i.test(hostOf(url)),
  fromUrl(url) { const r = emptyScrape(); r.auction.house = this.house; return r; },
  parse(page, url) {
    const r = emptyScrape(); r.auction.house = this.house;
    const h = page.html || '';
    const objectId = (url.match(/lot-(\d+)/i) || [])[1];
    let lot = null, sale = null;
    if (objectId) {
      let i = h.indexOf(`"lots":[{"object_id":"${objectId}"`);
      if (i >= 0) i += '"lots":['.length; else i = h.indexOf(`{"object_id":"${objectId}"`);
      lot = extractJsonAt(h, i);
    }
    const si = h.indexOf('"sale":{"sale_id"');
    if (si >= 0) sale = extractJsonAt(h, si + '"sale":'.length);

    if (lot) {
      const primary = titleCaseIfCaps(lot.title_primary_txt).replace(/\s*\((?:[^)]*\d{4}[^)]*)\)\s*$/, '');
      r.lot.name = joinArtistTitle(primary, titleCaseIfCaps(lot.title_secondary_txt));
      r.lot.lotNumber = lot.lot_id_txt || '';
      r.lot.estimate = lot.estimate_on_request ? 'Estimate on request' : (lot.estimate_txt || lot.lot_estimate_txt || '');
      if (lot.price_realised_txt && !lot.is_unsold) r.lot.hammerPrice = lot.price_realised_txt;
      r.lot.lotImageUrl = lot.lot_assets?.find(a => a.image_url)?.image_url || '';
    }
    if (sale) {
      r.auction.name = sale.title_txt || '';
      // Online sales run start_date -> end_date; the close is what matters.
      const s = (sale.start_date||'').slice(0,10), e = (sale.end_date||'').slice(0,10);
      r.auction.date = (e && e >= s) ? e : s;
      r.auction.url = (sale.url || '').replace(/\/$/, '');
    }
    // Catalogue text (medium, size, provenance) lives in the Details panel.
    const di = h.lastIndexOf('<', h.indexOf('class="chr-lot-details"'));
    if (di >= 0) {
      const stop = /^(Related articles|More from|Brought to you by|Lot Essay|Specialists?|Condition report|Ask a question|Conditions of sale)/i;
      const skip = new Set(['details', 'loading details',
        String(lot?.title_primary_txt||'').trim().toLowerCase(), String(lot?.title_secondary_txt||'').trim().toLowerCase()]);
      const lines = [];
      for (const l of htmlToText(h.slice(di, di + 30000)).split('\n')) {
        if (stop.test(l)) break;
        if (skip.has(l.toLowerCase())) continue;
        lines.push(l);
      }
      r.lot.description = lines.join('\n').slice(0, 900);
    }
    // Fallback when the JSON wasn't there (layout change, or text-only fetch).
    if (!r.lot.name) r.lot.name = titleCaseIfCaps((page.meta['og:title'] || page.title || '').replace(/\s*\|\s*Christie's\s*$/i, ''));
    if (!r.lot.lotImageUrl) r.lot.lotImageUrl = page.meta['og:image'] || '';
    return r;
  },
};

// ── Sotheby's ──
// og:title is "Artist | Title | Sale name"; og:description holds the full
// catalogue entry as HTML.
const sothebysScraper = {
  id: 'sothebys', house: "Sotheby's", format: 'markdown',
  matches: url => /(^|\.)sothebys\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape(); r.auction.house = this.house;
    const m = url.match(/^(https?:\/\/[^/]+\/[a-z]{2}\/buy\/auction\/\d{4}\/[^/?#]+)/i);
    if (m) r.auction.url = m[1];
    return r;
  },
  parse(page, url) {
    const r = this.fromUrl(url);
    const c = page.content || '';
    // Ignore the "You May Also Like" carousel — it has other lots' estimates.
    const main = c.split(/\n\s*You May Also Like\s*\n/i)[0];
    const parts = (page.meta['og:title'] || page.title || '').split(/\s+\|\s+/).map(s => s.trim()).filter(Boolean);
    if (parts.length >= 3) { r.lot.name = joinArtistTitle(parts[0], parts[1]); r.auction.name = parts.slice(2).join(' | '); }
    else if (parts.length === 2) { r.lot.name = parts[0]; r.auction.name = parts[1]; }
    else r.lot.name = parts[0] || '';
    r.lot.lotNumber = (main.match(/^\s*Lot\s+(\d+[A-Za-z]?)\s*$/m) || [])[1] || '';
    r.lot.estimate = valueAfterLabel(main, 'Estimate');
    const sold = valueAfterLabel(main, '(?:Lot\\s+)?Sold(?:\\s+for)?');
    if (/\d/.test(sold)) r.lot.hammerPrice = sold;
    // "Auction Closed\n\nNovember 19, 10:10 PM GMT" — year only in the URL.
    const year = (url.match(/\/auction\/(\d{4})\//) || [])[1];
    const when = valueAfterLabel(main, '(?:Auction Closed|Bidding Closes?|Closes|Live Auction Begins(?: on)?|Auction Begins|Lots Begin Closing)');
    r.auction.date = parseLooseDate(when, year);
    r.lot.description = htmlToText(page.meta['og:description'] || '').slice(0, 900);
    r.lot.lotImageUrl = page.meta['og:image'] || '';
    return r;
  },
};

// ── Phillips ──
// Lot number and title are headings ("## 105", "### Wildflowers 1"); the
// artist and sale date are in the keywords meta tag.
const phillipsScraper = {
  id: 'phillips', house: 'Phillips', format: 'markdown',
  matches: url => /(^|\.)phillips\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape(); r.auction.house = this.house;
    const m = url.match(/\/detail\/([^/]+)\/\d+/i);
    if (m) r.lot.name = slugToWords(m[1]);
    return r;
  },
  parse(page, url) {
    const r = emptyScrape(); r.auction.house = this.house;
    const c = page.content || '';
    const kw = (page.meta.keywords || '').split(/\s*,\s*/);
    // "Phillips Auctioneers LLC, auction, Lot, Alex Katz, New York Auction 20 November 2026"
    const lotIdx = kw.findIndex(k => /^lot$/i.test(k));
    let artist = lotIdx >= 0 ? (kw[lotIdx+1] || '') : '';
    if (!artist) artist = this.fromUrl(url).lot.name;
    const title = ((c.match(/^###\s+(.+)$/m) || [])[1] || '').trim();
    r.lot.name = joinArtistTitle(artist, title);
    r.lot.lotNumber = ((c.match(/^##\s+(\d+[A-Za-z]?)\s*$/m) || [])[1] || '');
    r.lot.estimate = valueAfterLabel(c, 'Estimate');
    const sold = valueAfterLabel(c, 'Sold For');
    if (/\d/.test(sold)) r.lot.hammerPrice = sold;
    const desc = decodeEntities(page.meta.description || '');
    r.auction.name = ((desc.match(/featured in Phillips['’]?\s+(.+?)\s+Auction in\b/i) || [])[1] || '').trim();
    if (!r.auction.name && artist) r.auction.name = decodeEntities(page.meta['og:title'] || '').replace(artist, '').trim();
    r.auction.date = parseLooseDate(kw.slice(lotIdx+2).join(' '));
    r.lot.lotImageUrl = page.meta['og:image'] || '';
    const code = (r.lot.lotImageUrl.match(/auction-assets\/([A-Z]{2}\d{5,})\//) || [])[1];
    if (code) r.auction.url = `https://www.phillips.com/auction/${code}`;
    // Catalogue lines (signature, medium, size, date) are the short lines
    // right after the estimate/price block, before the essay starts.
    const anchor = sold ? sold : r.lot.estimate;
    const after = anchor ? c.slice(c.indexOf(anchor) + anchor.length) : '';
    const lines = [];
    for (const l of after.split('\n').map(s => s.trim()).filter(Boolean)) {
      if (/^(estimate|sold for|#)/i.test(l) || l.startsWith('![')) { if (lines.length) break; else continue; }
      if (l.length > 160) break;
      lines.push(l.replace(/^_|_$/g, ''));
      if (lines.length >= 8) break;
    }
    r.lot.description = lines.join('\n');
    return r;
  },
};

// ── Bonhams ──
// Bonhams bot-walls the reader most of the time, so get what we can from the
// URL: /auction/29123/lot/45/artist-title-slug/
const bonhamsScraper = {
  id: 'bonhams', house: 'Bonhams', format: 'markdown',
  matches: url => /(^|\.)bonhams\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape(); r.auction.house = this.house;
    const m = url.match(/^(https?:\/\/[^/]+\/auction\/\d+)\/lot\/(\d+[a-z]?)(?:\/([^/?#]+))?/i);
    if (m) { r.auction.url = m[1]; r.lot.lotNumber = m[2]; if (m[3]) r.lot.name = slugToWords(m[3]); }
    return r;
  },
  parse(page, url) {
    const r = genericScraper.parse(page, url);
    const base = this.fromUrl(url);
    r.lot.lotNumber = base.lot.lotNumber || r.lot.lotNumber;
    r.auction.url = base.auction.url || r.auction.url;
    r.auction.house = this.house;
    return r;
  },
};

// ── Interenchères (French regional houses) ──
// Behind Cloudflare: the raw page is always walled, the text version gets
// through most of the time, so it's fetched as text with a retry.
// og:title is truncated; og:description has the full catalogue line:
// "In detail: Lot no. 658Ablade GLOVER (1934), *Disorderly Disorderly*, HST, …"
const interencheresScraper = {
  id: 'interencheres', house: '', format: 'markdown', retries: 1, noGenericFallback: true,
  matches: url => /(^|\.)interencheres\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape();
    const m = url.match(/^(https?:\/\/[^/]+\/(?:[a-z]{2}-[A-Z]{2}\/)?[^/]+\/[^/]+-\d+)\/lot-\d+/);
    if (m) r.auction.url = m[1];
    return r;
  },
  parse(page, url) {
    const r = this.fromUrl(url);
    const c = page.content || '';
    const ogd = decodeEntities(page.meta['og:description'] || page.meta.description || '');
    // The lot number runs straight into the text ("658Ablade"), so digits only.
    const full = ogd.replace(/^(?:In detail|En détail)\s*:\s*(?:Lot|Lot no\.?|Lot n°)\s*\d+\s*/i, '').trim();
    r.lot.lotNumber = (c.match(/^#\s*(\d+\s?(?:bis|ter|[A-Z])?)\s+-\s/m) || ogd.match(/Lot(?: no\.?| n°)?\s*(\d+)/i) || [])[1] || '';
    // "Artist (dates), *Title*, details" — the italic part is the title.
    const m = full.match(/^(.+?)\s*(?:\([^)]*\))?\s*,\s*\*([^*]+)\*/);
    r.lot.name = m ? joinArtistTitle(fixCapsWords(m[1]), m[2]) : fixCapsWords(full.split(/,\s/)[0]).slice(0, 120);
    r.lot.description = full.replace(/\*/g, '');
    r.lot.estimate = ((c.match(/(?:^|\n)\s*Estimat(?:e|ion)\s*:?\s*([^\n]*\d[^\n]*)/i) || [])[1] || '').trim();
    const sold = (c.match(/(?:^|\n)\s*(?:Sold for|Result|Adjugé|Hammer price)\s*:?\s*([^\n]*\d[^\n]*)/i) || [])[1];
    if (sold) r.lot.hammerPrice = sold.trim();
    const house = c.match(/\[([^\]]+)\]\(https?:\/\/[^)]*\/commissaire-priseur\/[^)]+\)\s*\n+\s*#/);
    if (house) r.auction.house = fixCapsWords(house[1]);
    const sale = c.match(/About the sale\s*\[([^\]]+)\]\((https?:\/\/[^)]+)\)/i) || c.match(/(?:À propos de la vente|A propos de la vente)\s*\[([^\]]+)\]\((https?:\/\/[^)]+)\)/i);
    if (sale) { r.auction.name = titleCaseIfCaps(sale[1]); r.auction.url = sale[2]; }
    const when = (c.match(/(?:Auction time|Date de la vente|Date de vente)\s*([^\n]+)/i) || [])[1];
    r.auction.date = parseDateNoYear(when || '');
    // og:image is a 400px thumbnail; the full-size link is in the gallery.
    const og = page.meta['og:image'] || '';
    const fileId = (og.match(/\/(\d{4}\/\d{2}\/\d{2}\/[^/?#]+)$/) || [])[1];
    const big = fileId && (c.match(new RegExp(`\\((https://thumbor[^)\\s]*?=/${fileId.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\)`)) || [])[1];
    r.lot.lotImageUrl = big || og;
    return r;
  },
};

// ── Invaluable ──
// The text version has only the house's terms; the raw page embeds the
// whole lot record as JSON ("pdp":{…,"lotData":{…},"catalogData":{…}}).
const invaluableScraper = {
  id: 'invaluable', house: '', format: 'html', retries: 1, noGenericFallback: true,
  matches: url => /(^|\.)invaluable\.(com|co\.uk)$/i.test(hostOf(url)),
  parse(page, url) {
    const r = emptyScrape();
    const h = page.html || '';
    const i = h.indexOf('"pdp":{');
    const pdp = i >= 0 ? extractJsonAt(h, i + '"pdp":'.length) : null;
    const lot = pdp?.lotData, cat = pdp?.catalogData;
    if (lot) {
      // "Glover, Ablade: Abstrakte Komposition" -> "Ablade Glover — Abstrakte Komposition"
      const t = String(lot.lotTitle || '');
      const m = t.match(/^([^,:]+),\s*([^:]+):\s*(.+)$/);
      r.lot.name = m ? joinArtistTitle(`${m[2].trim()} ${m[1].trim()}`, m[3]) : t;
      r.lot.lotNumber = lot.lotNumber || '';
      const sym = lot.currencySymbol || (lot.currency ? lot.currency + ' ' : '');
      if (lot.estimateLow || lot.estimateHigh) {
        r.lot.estimate = [formatMoney(sym, lot.estimateLow), formatMoney(sym, lot.estimateHigh)].filter(Boolean).join(' – ');
      }
      if (lot.isLotSold && lot.soldAmount) r.lot.hammerPrice = formatMoney(sym, lot.soldAmount);
      r.lot.description = String(lot.lotDescription || '').split(/\s\/\/\s/)[0].trim().slice(0, 900);
      const ph = (lot.photos || [])[0];
      r.lot.lotImageUrl = ph?.large || ph?.medium || '';
    }
    if (cat) {
      r.auction.name = cat.title || '';
      r.auction.date = String(cat.date || '').slice(0, 10);
      const ref = String(cat.ref || '');
      const link = ref && h.match(new RegExp(`https://www\\.invaluable\\.com/catalog/[^"'\\s<>]*${ref}`, 'i'));
      if (link) r.auction.url = link[0];
    }
    r.auction.house = pdp?.auctionHouseData?.name || '';
    // Fallbacks from the page head when the JSON is missing.
    if (!r.lot.name) r.lot.name = decodeEntities(page.meta['og:title'] || page.title || '').replace(/^At Auction:\s*/i, '');
    if (!r.auction.house) r.auction.house = (decodeEntities(page.meta.description || '').match(/ from (.+?) on [A-Z][a-z]+ \d/) || [])[1] || '';
    if (!r.lot.lotImageUrl) r.lot.lotImageUrl = page.meta['og:image'] || '';
    return r;
  },
};

// ── LiveAuctioneers ──
const liveAuctioneersScraper = {
  id: 'liveauctioneers', house: '', format: 'markdown', retries: 1, noGenericFallback: true,
  matches: url => /(^|\.)liveauctioneers\.com$/i.test(hostOf(url)),
  parse(page, url) {
    const r = emptyScrape();
    const c = page.content || '';
    const itemId = (url.match(/\/item\/(\d+)/) || [])[1];
    // The lot's own title sits just above its date and estimate.
    const head = c.match(/\n\s*([^\n]+?)\s*\n+\s*[A-Z][a-z]{2} \d{1,2}, \d{4}[^\n]*\n+\s*Estimate\b/);
    const title = head ? head[1] : (page.title || '').replace(/\s+Auction$/i, '');
    r.lot.name = splitArtistParens(title);
    r.lot.lotNumber = ((c.match(/Viewing Lot:\s*(\w+)/i) || [])[1] || '').replace(/^0+(?=\w)/, '');
    r.lot.estimate = ((c.match(/(?:^|\n)\s*Estimate\s*:?\s*([^\n]*\d[^\n]*)/i) || [])[1] || '').trim();
    const sold = (c.match(/(?:^|\n)\s*(?:Sold for|Price Realized|Sold)\s*:?\s*\n*\s*([^\n]*\d[^\n]*)/i) || [])[1];
    if (sold) r.lot.hammerPrice = sold.trim();
    r.lot.description = valueAfterLabel(c, 'Description');
    const when = (c.match(/(?:The auction starts|Auction (?:date|ended|ends)|Sale date)\s*:?\s*([^\n]+)/i) || [])[1];
    r.auction.date = parseLooseDate(when || '');
    const houseBlock = c.split(/\n\s*Meet the Auction House\s*\n/i)[1] || '';
    r.auction.house = (houseBlock.match(/^\s*([^\n]+)/) || [])[1]?.trim() || '';
    const sale = (houseBlock.match(/\bFOLLOW\s*\n+\s*([^\n]+)/) || [])[1];
    if (sale) r.auction.name = titleCaseIfCaps(sale.trim());
    const cat = c.match(/https:\/\/www\.liveauctioneers\.com\/catalog\/[^)\s"]+/);
    if (cat) r.auction.url = cat[0];
    r.lot.lotImageUrl = pickImage(page, itemId ? `${itemId}_1` : '');
    return r;
  },
};

// ── Drouot ──
// "# 206 - Bruce ONOBRAKPEYA (1932)"; the meta description has the full
// catalogue entry with its line breaks squashed ("(1932)Set of five prints").
const drouotScraper = {
  id: 'drouot', house: '', format: 'markdown', retries: 1, noGenericFallback: true,
  matches: url => /(^|\.)drouot\.com$/i.test(hostOf(url)),
  parse(page, url) {
    const r = emptyScrape();
    const c = page.content || '';
    const h1 = c.match(/^#\s*(\d+[A-Za-z]?)\s*-\s*(.+)$/m);
    if (h1) r.lot.lotNumber = h1[1];
    const lines = decodeEntities(page.meta.description || page.meta['og:description'] || '')
      .split(/(?<=[a-z0-9)–.])(?=[A-Z][a-z])/).map(s => s.trim()).filter(Boolean);
    const artist = fixCapsWords((h1 ? h1[2] : lines[0] || '').replace(/\s*\([^)]*\)\s*$/, ''));
    const titleLine = lines.length > 1 && h1 && lines[0].startsWith(h1[2].trim()) ? lines[1] : '';
    r.lot.name = joinArtistTitle(artist, titleLine);
    // The page text keeps proper spacing between catalogue lines; prefer it.
    const descLine = h1 && c.split('\n').map(s => s.trim()).find(l => l.startsWith(h1[2].trim()) && l.length > h1[2].trim().length + 20);
    r.lot.description = (descLine || lines.join('\n')).slice(0, 900);
    r.lot.estimate = valueAfterLabel(c, '#*\\s*Estimat(?:e|ion)');
    const sold = valueAfterLabel(c, '#*\\s*(?:Result|Sold for|Hammer price|Adjugé)');
    if (/\d/.test(sold)) r.lot.hammerPrice = sold;
    // "[AZ Auction](…)+3222180018[info@…](mailto:…)" — the first link is the name.
    const houseLine = valueAfterLabel(c, '#*\\s*Auction house');
    r.auction.house = (houseLine.match(/\[([^\]]+)\]/) || [])[1] || linkText(houseLine);
    const details = c.split(/\n#*\s*Auction details[^\n]*\n/i)[1] || '';
    const sale = details.match(/\[([^\]]+)\]\((https?:\/\/drouot\.com\/[a-z]{2}\/v\/[^)]+)\)/);
    if (sale) {
      r.auction.name = decodeEntities(sale[1]);
      r.auction.url = sale[2];
      r.auction.date = parseDateNoYear(details.slice(details.indexOf(sale[0]) + sale[0].length, details.indexOf(sale[0]) + sale[0].length + 120));
    }
    if (!r.auction.date) r.auction.date = parseDateNoYear((c.match(/\blive\s+([A-Z][a-z]+ \d{1,2})/) || [])[1] || '');
    r.lot.lotImageUrl = pickImage(page);
    return r;
  },
};

// ── the-saleroom ──
// Always bot-walled for the reader, so it's URL-only: the house and the
// catalogue come from /auction-catalogues/<house>/catalogue-id-<id>/lot-…
const saleroomScraper = {
  id: 'saleroom', house: '', format: 'markdown', noGenericFallback: true,
  matches: url => /(^|\.)the-saleroom\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape();
    const m = url.match(/^(https?:\/\/[^/]+\/[a-z]{2}-[a-z]{2}\/auction-catalogues\/([^/]+)\/catalogue-id-[^/?#]+)/i);
    if (m) { r.auction.url = m[1]; r.auction.house = slugToWords(m[2]); }
    const lot = url.match(/\/lot-(\d+[a-z]?)(?:-|\/|$|\?)/i);   // older URLs carry the lot number
    if (lot) r.lot.lotNumber = lot[1];
    return r;
  },
  parse(page, url) { return mergeScrape(this.fromUrl(url), genericScraper.parse(page, url)); },
};

// ── Lot-Art (aggregator) ──
// Shows title, description and the selling house; the estimate is behind its
// paid "Unlock", and the only number shown is Lot-Art's own listing id (not
// the lot number), so lotNumber is left blank on purpose. Sale date is in
// the URL: …-26.11.26-stockholm -> 2026-11-26.
const lotArtScraper = {
  id: 'lotart', house: '', format: 'markdown', noGenericFallback: true,
  matches: url => /(^|\.)lot-art\.com$/i.test(hostOf(url)),
  fromUrl(url) {
    const r = emptyScrape();
    const d = url.match(/-(\d{2})\.(\d{2})\.(\d{2})-[^/]*$/);
    if (d) r.auction.date = `20${d[3]}-${d[2]}-${d[1]}`;
    return r;
  },
  parse(page, url) {
    const r = this.fromUrl(url);
    const c = page.content || '';
    // "BRUCE ONOBRAKPEYA (GEB. 1932). Erhue Orise. in Germany"
    const t = decodeEntities(page.meta['og:title'] || page.title || '').replace(/\s+in\s+[A-Z][\w\s]+$/, '').trim();
    const m = t.match(/^(.+?)\s*\([^)]*\)\.?\s*(.*?)\.?$/);
    r.lot.name = m ? joinArtistTitle(titleCaseIfCaps(m[1]), m[2]) : titleCaseIfCaps(t);
    const afterH1 = c.split(/^#\s+[^\n]+$/m)[1] || '';
    r.lot.description = (afterH1.split('\n').map(s => s.trim()).find(l => l.length > 40 && !/^\[|^\*/.test(l)) || '').slice(0, 900);
    const est = valueAfterLabel(c, '#*\\s*Estimate');
    if (est && !/unlock/i.test(est)) r.lot.estimate = est;
    r.auction.house = valueAfterLabel(c, '#*\\s*Auction House');
    r.lot.lotImageUrl = pickImage(page);
    return r;
  },
};

// ── Generic fallback: any other site ──
const genericScraper = {
  id: 'generic', house: '', format: 'markdown',
  matches: () => true,
  parse(page, url) {
    const r = emptyScrape();
    const content = page.content || '', title = page.meta['og:title'] || page.title || '';
    Object.assign(r.lot, parseLotContent(content, title, url));
    const a = parseAuctionContent(content, title, url);
    r.auction.house = a.house; r.auction.date = a.date;
    r.lot.lotImageUrl = pickImage(page);
    return r;
  },
};

const SCRAPERS = [christiesScraper, sothebysScraper, phillipsScraper, bonhamsScraper,
  interencheresScraper, invaluableScraper, liveAuctioneersScraper, drouotScraper, saleroomScraper, lotArtScraper];

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./,''); } catch(e) { return ''; } }
function getScraperForUrl(url) { return SCRAPERS.find(s => s.matches(url)) || genericScraper; }

// Fetches a page through the reader. Throws Error with message RATE_LIMIT,
// HTTP_<status>, BOT_BLOCKED, or the browser's own fetch error.
async function fetchPageViaReader(url, format) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  // Accept is CORS-safelisted. X-Return-Format is not, so it triggers a CORS
  // preflight — the reader answers that permissively (checked 21 Nov 2026,
  // including Origin: null for file:// pages), but if that ever stops working
  // scrapeLotUrl() falls back to a plain text fetch.
  const headers = { 'Accept': 'application/json' };
  if (format === 'html') headers['X-Return-Format'] = 'html';
  try {
    const resp = await fetch(`https://r.jina.ai/${url}`, { signal: ctrl.signal, headers });
    if (!resp.ok) {
      let bodyText = '';
      try { bodyText = await resp.text(); } catch(_) {}
      console.error('[AuctionTracker] Reader fetch non-OK:', resp.status, bodyText.slice(0,500));
      if (resp.status === 429) throw new Error('RATE_LIMIT');
      throw new Error('HTTP_'+resp.status);
    }
    const d = (await resp.json()).data || {};
    const page = { title: d.title || '', content: d.content || d.text || '', html: d.html || '', meta: d.metadata || {} };
    // Bot-walled sites (Bonhams, Cloudflare-protected pages) still return 200,
    // but the "page" is a verification shell with no lot content.
    const blockSignals = [/checking your browser/i, /just a moment/i, /access denied/i, /are you a human/i,
      /verify you are human/i, /enable javascript and cookies/i, /request blocked/i, /captcha/i,
      /cf-browser-verification/i, /performing security verification/i, /confirm you are human/i,
      /human verification/i, /complete the security check/i];
    const text = page.content || htmlToText(page.html);
    const head = (page.title + ' ' + text).slice(0, 800);
    if (text.trim().length < 400 && blockSignals.some(p => p.test(head))) throw new Error('BOT_BLOCKED');
    return page;
  } finally {
    clearTimeout(t);
  }
}

// Scrapes a lot URL with the right house scraper. Always resolves:
// { data, scraper, error } — `data` holds whatever was found (possibly only
// URL-derived fields), `error` is the fetch failure message if there was one.
async function scrapeLotUrl(url) {
  const scraper = getScraperForUrl(url);
  const data = scraper.fromUrl ? scraper.fromUrl(url) : emptyScrape();
  let page = null, error = null;
  // Sites behind Cloudflare (Interenchères, Invaluable…) often pass on a
  // second try, so those scrapers ask for retries. Never retry a rate limit.
  for (let attempt = 0; attempt <= (scraper.retries || 0) && !page; attempt++) {
    try {
      page = await fetchPageViaReader(url, scraper.format);
      error = null;
    } catch (err) {
      error = err;
      if (err.message === 'RATE_LIMIT') break;
    }
  }
  // An HTML fetch can fail where text works (e.g. preflight refused) — retry as text.
  if (!page && scraper.format === 'html' && error && !['RATE_LIMIT','BOT_BLOCKED'].includes(error.message) && error.name !== 'AbortError') {
    try { page = await fetchPageViaReader(url, 'markdown'); error = null; } catch (err2) { error = err2; }
  }
  if (page) {
    let parsed = null;
    try { parsed = scraper.parse(page, url); }
    catch (err) { console.error(`[AuctionTracker] ${scraper.id} scraper failed:`, err); }
    if (parsed) {
      // House scrapers take priority over URL-derived guesses.
      for (const part of ['lot','auction']) for (const k of Object.keys(parsed[part])) {
        if (parsed[part][k]) data[part][k] = parsed[part][k];
      }
    }
    if (scraper !== genericScraper && !scraper.noGenericFallback) {
      try { mergeScrape(data, genericScraper.parse(page, url)); } catch(_) {}
    }
  }
  if (!data.auction.house) data.auction.house = scraper.house;
  return { data, scraper: scraper.id, error };
}

function countScraped(d) {
  return ['name','lotNumber','estimate','description','hammerPrice'].filter(k => d.lot[k]?.trim()).length;
}

// "Fetch" button in the New Lot / Add Possibility modals.
async function importLotFromUrl() {
  const urlEl = document.getElementById('import-url');
  const url = (urlEl?.value||'').trim();
  if (!url || !url.startsWith('http')) { setImportStatus('error','✕ Enter a valid URL'); return; }
  setImportStatus('loading','<span class="spinner"></span> Fetching lot data…');

  const { data, error } = await scrapeLotUrl(url);
  // The modal may have been closed while we waited.
  if (!document.getElementById('import-status')) return;

  fillLotForm(data.lot, url);
  const setIfEmpty = (id, val) => { const el = document.getElementById(id); if (el && val && !el.value) el.value = val; };
  // Only touch auction fields when the user hasn't picked an existing auction.
  if (!document.getElementById('auction-select')?.value) {
    setIfEmpty('f-auction-name',  data.auction.name);
    setIfEmpty('f-auction-house', data.auction.house);
    setIfEmpty('f-auction-date',  data.auction.date);
    setIfEmpty('f-auction-url',   data.auction.url);
    updateAuctionUrlBtn();
  }

  const fc = countScraped(data), hasImg = !!data.lot.lotImageUrl;
  if (error) {
    console.error('[AuctionTracker] Import failed:', error);
    let msg = '⚠️ Could not fetch. Try the paste option below.';
    if (error.name === 'AbortError') msg = '⚠️ Timed out. Try the paste option below.';
    else if (error.message === 'RATE_LIMIT') msg = '⚠️ Rate limited by the reader service — wait a moment and try again, or use paste below.';
    else if (error.message === 'BOT_BLOCKED') msg = '⚠️ This site is blocking automated access — copy the lot details manually and use 📷/🖼 to add the photo yourself.';
    else if (/^HTTP_4/.test(error.message)) msg = '⚠️ That page could not be read (site may be blocking access). Try the paste option below.';
    else if (/^HTTP_5/.test(error.message)) msg = '⚠️ Reader service error — try again shortly, or use paste below.';
    else if (error.message === 'Failed to fetch') msg = '⚠️ Network/browser blocked the request (see console for details). Try the paste option below.';
    if (fc) msg += ` (Lot number / title filled in from the URL.)`;
    setImportStatus('warn', msg, true);
    return;
  }
  if (fc === 0 && !hasImg) { setImportStatus('warn','⚠️ Could not extract data. Try the paste option below.', true); return; }
  const parts = [];
  if (fc) parts.push(fc+' field'+(fc>1?'s':''));
  if (hasImg) parts.push('image');
  setImportStatus('success','✓ Imported '+parts.join(' + ')+' — review before saving.');
}

// "Refresh from site" on an existing lot: re-reads the lot page and updates
// the fields that change over time (estimate, price realised), and fills in
// anything still blank. Never overwrites a title or description you've edited.
async function rescrapeLot(aId, lId) {
  const l = getLot(aId, lId); if (!l) return;
  if (!l.lotUrl) { toast('Add the lot URL first (Edit Details)'); return; }
  ui.rescraping = lId; render();
  const { data, error } = await scrapeLotUrl(l.lotUrl);
  ui.rescraping = null;

  const changes = {}, changed = [];
  const refresh = (key, label) => { const v = data.lot[key]; if (v && v !== l[key]) { changes[key] = v; changed.push(label); } };
  const fill    = (key, label) => { const v = data.lot[key]; if (v && !l[key]) { changes[key] = v; changed.push(label); } };
  refresh('estimate', 'estimate');
  refresh('hammerPrice', 'price');
  fill('lotNumber', 'lot number');
  fill('name', 'title');
  fill('description', 'description');
  fill('lotImageUrl', 'image');
  if (Object.keys(changes).length) updateLot(aId, lId, changes);

  const a = getAuction(aId);
  if (a) {
    const ac = {};
    for (const k of ['house','date','url']) if (data.auction[k] && !a[k]) ac[k] = data.auction[k];
    if (Object.keys(ac).length) { updateAuction(aId, ac); changed.push('sale details'); }
  }
  render();
  if (error && !changed.length) {
    toast(error.message === 'BOT_BLOCKED' ? '⚠️ This site is blocking automated access' : '⚠️ Could not refresh from the auction site');
  } else {
    toast(changed.length ? `Updated: ${changed.join(', ')}` : 'Already up to date');
  }
}

function parseLotContent(content, pageTitle, url) {
  const r = { name:'', lotNumber:'', estimate:'', description:'' };
  if (pageTitle) r.name = pageTitle
    .replace(/\s*[|\-–]\s*(Sotheby's|Christie's|Bonhams|Phillips|Dreweatts|Roseberys|Swan|Woolley|Tennants).*/i,'')
    .replace(/^Lot\s+\d+\s*[:\-–]\s*/i,'').trim();
  r.lotNumber = extractLotNum(url);
  if (!r.lotNumber) { const m = content.match(/\bLot\s+(?:No\.?\s*)?(\d+)\b/i); if (m) r.lotNumber = m[1]; }
  for (const p of [/estimate[:\s]+([£$€][^\n]{4,70})/i, /pre[- ]?sale estimate[:\s]+([^\n]{4,70})/i, /([£$€]\s?[\d,]+(?:\s*[–\-]\s*[£$€]?\s?[\d,]+)\s*(?:GBP|USD|EUR|HKD)?)/]) {
    const m = content.match(p); if (m) { r.estimate = m[1].trim().replace(/\s+/g,' ').substring(0,90); break; }
  }
  const lines = content.split('\n').map(l=>l.replace(/^#+\s*/,'').trim()).filter(Boolean);
  const desc = lines.filter(l => l.length>50 && l.length<700 && !l.match(/^!\[/) && !l.match(/^https?:\/\//) && !l.match(/^(lot|estimate|sold for|bid|hammer|register|sign in|log in|share|print|save|cookie|privacy|terms|follow|subscribe|navigation|menu|search|back to)/i));
  if (desc.length) r.description = desc.slice(0,4).join(' ').substring(0,600);
  return r;
}

function parseAuctionContent(content, pageTitle, url) {
  const r = { name:'', house:'', date:'' };
  const houses = ["Sotheby's","Christie's","Bonhams","Phillips","Dreweatts","Roseberys","Swan Galleries","Woolley & Wallis","Tennants","Heritage Auctions","Artcurial","Dorotheum"];
  if (url.includes('sothebys.com'))     r.house = "Sotheby's";
  else if (url.includes('christies.com'))  r.house = "Christie's";
  else if (url.includes('bonhams.com'))    r.house = "Bonhams";
  else if (url.includes('phillips.com'))   r.house = "Phillips";
  else if (url.includes('dreweatts.com'))  r.house = "Dreweatts";
  else if (url.includes('roseberys.co.uk')) r.house = "Roseberys";
  else if (url.includes('heritage'))       r.house = "Heritage Auctions";
  else { for (const h of houses) { if ((pageTitle+content).includes(h)) { r.house = h; break; } } }
  if (pageTitle) r.name = pageTitle.replace(/\s*[|\-–]\s*(Sotheby's|Christie's|Bonhams|Phillips|Dreweatts|Roseberys|Heritage|Artcurial|Dorotheum).*/i,'').replace(/\s*\|\s*(Online|Auction).*/i,'').replace(/^\s*(Sotheby's|Christie's|Bonhams|Phillips)\s*[|\-–:]\s*/i,'').trim();
  const months = {january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
  for (const p of [/(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})/i, /(\d{4})-(\d{2})-(\d{2})/, /(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})/i]) {
    const m = (content||pageTitle).match(p);
    if (m) {
      if (m[0].match(/\d{4}-\d{2}-\d{2}/)) r.date = m[0];
      else if (m[1]?.match(/\d+/) && m[2] && m[3]) { const mm = months[m[2].toLowerCase()]; if (mm) r.date=`${m[3]}-${mm}-${m[1].padStart(2,'0')}`; }
      else if (!m[1]?.match(/\d+/) && m[2] && m[3]) { const mm = months[m[1].toLowerCase()]; if (mm) r.date=`${m[3]}-${mm}-${m[2].padStart(2,'0')}`; }
      if (r.date) break;
    }
  }
  return r;
}

function extractLotNum(url) {
  const m = url.match(/\/lot[s]?[_\-]?\/(\d+)/i) || url.match(/[?&]lot[_]?(?:no|num|number)?=(\d+)/i) || url.match(/[_\-](\d{3,6})\/?(?:[?#]|$)/);
  return m ? m[1] : '';
}

function proxyImg(url) {
  if (!url) return '';
  if (url.startsWith('data:')) return url; // embedded/legacy image — already local, never proxy it
  if (url.includes('wsrv.nl')||url.includes('weserv.nl')) return url;
  if (url.includes('.supabase.co/storage/')) return url; // our own Storage upload — already fast + CORS-safe
  return `https://wsrv.nl/?url=${encodeURIComponent(url.replace(/^https?:\/\//,''))}&w=800&output=jpg&q=85`;
}

function fillLotForm(data, url) {
  const set = (id,val) => { const el=document.getElementById(id); if (el && val && !el.value) el.value=val; };
  set('f-name', data.name); set('f-lotnum', data.lotNumber);
  set('f-estimate', data.estimate); set('f-desc', data.description);
  set('f-hammer', data.hammerPrice);
  if (url) set('f-loturl', url);
  const imgEl = document.getElementById('f-imageurl');
  if (data.lotImageUrl && imgEl && !imgEl.value) {
    imgEl.value = data.lotImageUrl;
    const prev = document.getElementById('lot-img-preview');
    if (prev) {
      prev.style.display = 'block';
      prev.innerHTML = `<img src="${escA(proxyImg(data.lotImageUrl))}" style="max-width:100%;max-height:160px;border-radius:5px;border:1px solid var(--border);object-fit:contain;background:#f8f8f8;margin-top:8px" onerror="this.parentElement.style.display='none'">`;
    }
  }
}

function setImportStatus(type, html, showPaste) {
  const el = document.getElementById('import-status'); if (!el) return;
  el.className = `import-status show ${type}`; el.innerHTML = html;
  if (showPaste) { const p = document.getElementById('paste-fallback'); if (p) p.className='paste-fallback show'; }
}

function parseFromPasted() {
  const raw = (document.getElementById('paste-text')?.value||'').trim(); if (!raw) return;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const r = {};
  const lm = raw.match(/\bLot\s+(?:No\.?\s*)?(\d+)\b/i); if (lm) r.lotNumber = lm[1];
  for (const p of [/estimate[:\s]+([£$€][^\n]{4,70})/i, /([£$€]\s?[\d,]+(?:\s*[–\-]\s*[£$€]?\s?[\d,]+))/]) {
    const m = raw.match(p); if (m) { r.estimate = m[1].trim().replace(/\s+/g,' ').substring(0,90); break; }
  }
  const nl = lines.find(l => l.length>=8 && l.length<=200 && !l.match(/^https?:\/\//) && !l.match(/^[£$€\d]/) && !l.match(/^(lot|estimate|sold|bid|register|log|sign|share|print|save|cookie)/i));
  if (nl) r.name = nl;
  const dl = lines.filter(l => l.length>60 && !l.match(/^https?:\/\//));
  if (dl.length) r.description = dl.slice(0,3).join(' ').substring(0,500);
  fillLotForm(r,'');
  setImportStatus('success','✓ Fields pre-filled — review before saving.');
}

// ═══════════════════════════════════════
// LOT IMAGE UPLOAD (camera / file) — Supabase Storage
// ═══════════════════════════════════════
function handleLotImageFile(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = ''; // allow re-selecting the same file later
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please choose an image file'); return; }

  const prev = document.getElementById('lot-img-preview');
  if (prev) { prev.style.display = 'block'; prev.innerHTML = '<span style="font-family:Arial;font-size:12px;color:var(--muted)">Uploading photo…</span>'; }

  compressImageFile(file, 1200, 0.82)
    .then(blob => uploadBlobToStorage(blob))
    .then(publicUrl => {
      const el = document.getElementById('f-imageurl');
      if (el) el.value = publicUrl;
      if (prev) {
        prev.innerHTML = `<img src="${escA(publicUrl)}" style="max-width:100%;max-height:160px;border-radius:5px;border:1px solid var(--border);object-fit:contain;background:#f8f8f8">`;
      }
    })
    .catch(err => {
      console.error('[AuctionTracker] Image upload failed:', err);
      if (prev) prev.innerHTML = '';
      toast('⚠️ Could not upload that photo — check your connection');
    });
}

// Resizes an image file to fit within maxDim (longest side) and re-encodes
// as JPEG at the given quality, returning a Blob ready for Storage upload.
function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('encode failed')), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Uploads a Blob to the 'lot-images' Storage bucket and returns its public URL.
async function uploadBlobToStorage(blob) {
  const path = `${uuid()}.jpg`;
  const { error } = await sb.storage.from('lot-images').upload(path, blob, {
    contentType: 'image/jpeg', cacheControl: '3600', upsert: false
  });
  if (error) throw error;
  const { data } = sb.storage.from('lot-images').getPublicUrl(path);
  return data.publicUrl;
}

// Used only by the one-time legacy-data import: converts an old base64
// data: URL (from before the Storage migration) into a real uploaded photo.
async function uploadDataUrlToStorage(dataUrl) {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return uploadBlobToStorage(blob);
}

// ═══════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════
function badge(s) {
  const L = {pending:'Awaiting Auction',won:'Won',transit:'Transit',archived:'Archived',lost:'Lost',passed:'Passed'};
  return `<span class="badge badge-${s}">${L[s]||s}</span>`;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return esc(s); }
function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); } catch(e) { return d; }
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
render(); // initial loading screen while we check for a session

sb.auth.onAuthStateChange((event, session) => {
  const wasSignedIn = !!auth.user;
  auth.user = session?.user || null;
  auth.checked = true;
  auth.busy = false;

  if (auth.user && !wasSignedIn) {
    // Just signed in (fresh sign-in or session restored on page load)
    loadDataFromSupabase();
  } else if (!auth.user) {
    state.auctions = [];
    render();
  } else {
    render();
  }
});
