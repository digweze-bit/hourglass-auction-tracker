// ═══════════════════════════════════════
// LOT URL IMPORT (Jina AI)
// ═══════════════════════════════════════
async function importLotFromUrl() {
  const urlEl = document.getElementById('import-url');
  const url = (urlEl?.value||'').trim();
  if (!url || !url.startsWith('http')) { setImportStatus('error','✕ Enter a valid URL'); return; }
  setImportStatus('loading','<span class="spinner"></span> Fetching lot data…');
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 25000);
    // NOTE: only send CORS-safelisted headers here (Accept is safelisted).
    // Adding custom headers like X-Return-Format forces a CORS preflight
    // (an OPTIONS request) that Jina may not answer permissively, which makes
    // the browser abort the whole request with a generic "failed to fetch" —
    // no server error, no timeout, just silence. Accept alone is enough to
    // get JSON back from r.jina.ai.
    const resp = await fetch(`https://r.jina.ai/${url}`, {
      signal: ctrl.signal,
      headers: { 'Accept': 'application/json' }
    });
    clearTimeout(t);
    if (!resp.ok) {
      let bodyText = '';
      try { bodyText = await resp.text(); } catch(_) {}
      console.error('[AuctionTracker] Jina fetch non-OK:', resp.status, bodyText.slice(0,500));
      if (resp.status === 429) throw new Error('RATE_LIMIT');
      throw new Error('HTTP_'+resp.status);
    }
    const json = await resp.json();
    const d = json.data || {};
    const content = d.content || d.text || '';
    const pageTitle = d.title || '';
    const jinaImgs = d.images || {};

    // Some auction sites (Bonhams among them) actively bot-wall automated
    // fetchers — including headless-browser crawlers like Jina's. When that
    // happens we still get a 200 OK back, but the "page" is a bot-check
    // shell, not the real lot page: little/no real content, no lot images.
    // Detect that up front rather than silently parsing junk into fields.
    const blockSignals = [/checking your browser/i, /just a moment/i, /access denied/i, /are you a human/i,
      /verify you are human/i, /enable javascript and cookies/i, /request blocked/i, /captcha/i, /cf-browser-verification/i];
    const combinedForCheck = (pageTitle + ' ' + content).slice(0, 800);
    const looksBlocked = (content.trim().length < 200) && blockSignals.some(p => p.test(combinedForCheck));
    if (looksBlocked) throw new Error('BOT_BLOCKED');

    const parsed = parseLotContent(content, pageTitle, url);

    // Image extraction from both sources
    const mdImgs = [];
    const mdPat = /!\[[^\]]*\]\((https?:\/\/[^)]+)\)/g; let m;
    while ((m = mdPat.exec(content)) !== null) mdImgs.push(m[1]);
    const allImgs = [...new Set([...Object.keys(jinaImgs), ...mdImgs])];
    const scored = allImgs.map(u => {
      let s = 0;
      if (u.match(/\.(jpg|jpeg|png|webp)/i)) s += 10;
      if (u.match(/lot|artwork|object|item|figure|painting|work/i)) s += 8;
      if (u.match(/thumbnail|thumb|icon|logo|avatar|banner|sprite|pixel|social/i)) s -= 15;
      const alt = (jinaImgs[u]||'').toLowerCase();
      if (alt.match(/lot|artwork|painting|sculpture/i)) s += 5;
      if (alt.match(/logo|icon|social/i)) s -= 10;
      return { u, s };
    }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
    const bestImg = scored[0]?.u ? proxyImg(scored[0].u) : '';
    if (bestImg) parsed.lotImageUrl = bestImg;

    // Also try to fill auction fields from page if not already set
    const auctionParsed = parseAuctionContent(content, pageTitle, url);
    if (!document.getElementById('f-auction-name')?.value && auctionParsed.name) {
      const el = document.getElementById('f-auction-name');
      if (el) el.value = auctionParsed.name;
    }
    if (!document.getElementById('f-auction-house')?.value && auctionParsed.house) {
      const el = document.getElementById('f-auction-house');
      if (el) el.value = auctionParsed.house;
    }

    fillLotForm(parsed, url);
    const fc = ['name','lotNumber','estimate','description'].filter(k => parsed[k]?.trim()).length;
    if (fc === 0 && !bestImg) { setImportStatus('warn','⚠️ Could not extract data. Try the paste option below.', true); }
    else {
      const parts = [];
      if (fc) parts.push(fc+' field'+(fc>1?'s':''));
      if (bestImg) parts.push('image');
      setImportStatus('success','✓ Imported '+parts.join(' + ')+' — review before saving.');
    }
  } catch(err) {
    console.error('[AuctionTracker] Import failed:', err);
    let msg = '⚠️ Could not fetch. Try the paste option below.';
    if (err.name === 'AbortError') msg = '⚠️ Timed out. Try the paste option below.';
    else if (err.message === 'RATE_LIMIT') msg = '⚠️ Rate limited by the reader service — wait a moment and try again, or use paste below.';
    else if (err.message === 'BOT_BLOCKED') msg = '⚠️ This site is blocking automated access — copy the lot details manually and use 📷/🖼 to add the photo yourself.';
    else if (/^HTTP_4/.test(err.message)) msg = '⚠️ That page could not be read (site may be blocking access). Try the paste option below.';
    else if (/^HTTP_5/.test(err.message)) msg = '⚠️ Reader service error — try again shortly, or use paste below.';
    else if (err.message === 'Failed to fetch') msg = '⚠️ Network/browser blocked the request (see console for details). Try the paste option below.';
    setImportStatus('warn', msg, true);
  }
}

function parseLotContent(content, pageTitle, url) {
  const r = { name:'', lotNumber:'', estimate:'', description:'' };
  if (pageTitle) r.name = pageTitle
    .replace(/\s*[|\-–]\s*(Sotheby's|Christie's|Bonhams|Phillips|Dreweatts|Roseberys|Swan|Woolley|Tennants).*/i,'')
    .replace(/^Lot\s+\d+\s*[:\-–]\s*/i,'').trim();
  r.lotNumber = extractLotNum(url);
  if (!r.lotNumber) { const m = content.match(/\bLot\s+(?:No\.?\s*)?(\d+)\b/i); if (m) r.lotNumber = m[1]; }
  for (const p of [/estimate[:\s]+([£$€][^\n]{4,70})/i, /pre[- ]?sale estimate[:\s]+([^\n]{4,70})/i, /([£$€]\s?[\d,]+(?:\s*[–\-]\s*[£$€]?\s?[\d,]+)\s*(?:GBP|USD|EUR|HKD)?)/]) {
    const m = content.match(p); if (m) { r.estimate = m[1].trim().replace(/\s+/g,' ').substring(0,90); break; }
  }
  const lines = content.split('\n').map(l=>l.replace(/^#+\s*/,'').trim()).filter(Boolean);
  const desc = lines.filter(l => l.length>50 && l.length<700 && !l.match(/^!\[/) && !l.match(/^https?:\/\//) && !l.match(/^(lot|estimate|sold for|bid|hammer|register|sign in|log in|share|print|save|cookie|privacy|terms|follow|subscribe|navigation|menu|search|back to)/i));
  if (desc.length) r.description = desc.slice(0,4).join(' ').substring(0,600);
  return r;
}

function parseAuctionContent(content, pageTitle, url) {
  const r = { name:'', house:'', date:'' };
  const houses = ["Sotheby's","Christie's","Bonhams","Phillips","Dreweatts","Roseberys","Swan Galleries","Woolley & Wallis","Tennants","Heritage Auctions","Artcurial","Dorotheum"];
  if (url.includes('sothebys.com'))     r.house = "Sotheby's";
  else if (url.includes('christies.com'))  r.house = "Christie's";
  else if (url.includes('bonhams.com'))    r.house = "Bonhams";
  else if (url.includes('phillips.com'))   r.house = "Phillips";
  else if (url.includes('dreweatts.com'))  r.house = "Dreweatts";
  else if (url.includes('roseberys.co.uk')) r.house = "Roseberys";
  else if (url.includes('heritage'))       r.house = "Heritage Auctions";
  else { for (const h of houses) { if ((pageTitle+content).includes(h)) { r.house = h; break; } } }
  if (pageTitle) r.name = pageTitle.replace(/\s*[|\-–]\s*(Sotheby's|Christie's|Bonhams|Phillips|Dreweatts|Roseberys|Heritage|Artcurial|Dorotheum).*/i,'').replace(/\s*\|\s*(Online|Auction).*/i,'').replace(/^\s*(Sotheby's|Christie's|Bonhams|Phillips)\s*[|\-–:]\s*/i,'').trim();
  const months = {january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
  for (const p of [/(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})/i, /(\d{4})-(\d{2})-(\d{2})/, /(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})/i]) {
    const m = (content||pageTitle).match(p);
    if (m) {
      if (m[0].match(/\d{4}-\d{2}-\d{2}/)) r.date = m[0];
      else if (m[1]?.match(/\d+/) && m[2] && m[3]) { const mm = months[m[2].toLowerCase()]; if (mm) r.date=`${m[3]}-${mm}-${m[1].padStart(2,'0')}`; }
      else if (!m[1]?.match(/\d+/) && m[2] && m[3]) { const mm = months[m[1].toLowerCase()]; if (mm) r.date=`${m[3]}-${mm}-${m[2].padStart(2,'0')}`; }
      if (r.date) break;
    }
  }
  return r;
}

function extractLotNum(url) {
  const m = url.match(/\/lot[s]?[_\-]?\/(\d+)/i) || url.match(/[?&]lot[_]?(?:no|num|number)?=(\d+)/i) || url.match(/[_\-](\d{3,6})\/?(?:[?#]|$)/);
  return m ? m[1] : '';
}

function proxyImg(url) {
  if (!url) return '';
  if (url.startsWith('data:')) return url; // embedded/legacy image — already local, never proxy it
  if (url.includes('wsrv.nl')||url.includes('weserv.nl')) return url;
  if (url.includes('.supabase.co/storage/')) return url; // our own Storage upload — already fast + CORS-safe
  return `https://wsrv.nl/?url=${encodeURIComponent(url.replace(/^https?:\/\//,''))}&w=800&output=jpg&q=85`;
}

function fillLotForm(data, url) {
  const set = (id,val) => { const el=document.getElementById(id); if (el && val && !el.value) el.value=val; };
  set('f-name', data.name); set('f-lotnum', data.lotNumber);
  set('f-estimate', data.estimate); set('f-desc', data.description);
  if (url) set('f-loturl', url);
  if (data.lotImageUrl) {
    set('f-imageurl', data.lotImageUrl);
    const prev = document.getElementById('lot-img-preview');
    if (prev) {
      prev.style.display = 'block';
      prev.innerHTML = `<img src="${escA(data.lotImageUrl)}" style="max-width:100%;max-height:160px;border-radius:5px;border:1px solid var(--border);object-fit:contain;background:#f8f8f8;margin-top:8px" onerror="this.parentElement.style.display='none'">`;
    }
  }
}

function setImportStatus(type, html, showPaste) {
  const el = document.getElementById('import-status'); if (!el) return;
  el.className = `import-status show ${type}`; el.innerHTML = html;
  if (showPaste) { const p = document.getElementById('paste-fallback'); if (p) p.className='paste-fallback show'; }
}

function parseFromPasted() {
  const raw = (document.getElementById('paste-text')?.value||'').trim(); if (!raw) return;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const r = {};
  const lm = raw.match(/\bLot\s+(?:No\.?\s*)?(\d+)\b/i); if (lm) r.lotNumber = lm[1];
  for (const p of [/estimate[:\s]+([£$€][^\n]{4,70})/i, /([£$€]\s?[\d,]+(?:\s*[–\-]\s*[£$€]?\s?[\d,]+))/]) {
    const m = raw.match(p); if (m) { r.estimate = m[1].trim().replace(/\s+/g,' ').substring(0,90); break; }
  }
  const nl = lines.find(l => l.length>=8 && l.length<=200 && !l.match(/^https?:\/\//) && !l.match(/^[£$€\d]/) && !l.match(/^(lot|estimate|sold|bid|register|log|sign|share|print|save|cookie)/i));
  if (nl) r.name = nl;
  const dl = lines.filter(l => l.length>60 && !l.match(/^https?:\/\//));
  if (dl.length) r.description = dl.slice(0,3).join(' ').substring(0,500);
  fillLotForm(r,'');
  setImportStatus('success','✓ Fields pre-filled — review before saving.');
}

// ═══════════════════════════════════════
// LOT IMAGE UPLOAD (camera / file) — Supabase Storage
// ═══════════════════════════════════════
function handleLotImageFile(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = ''; // allow re-selecting the same file later
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please choose an image file'); return; }

  const prev = document.getElementById('lot-img-preview');
  if (prev) { prev.style.display = 'block'; prev.innerHTML = '<span style="font-family:Arial;font-size:12px;color:var(--muted)">Uploading photo…</span>'; }

  compressImageFile(file, 1200, 0.82)
    .then(blob => uploadBlobToStorage(blob))
    .then(publicUrl => {
      const el = document.getElementById('f-imageurl');
      if (el) el.value = publicUrl;
      if (prev) {
        prev.innerHTML = `<img src="${escA(publicUrl)}" style="max-width:100%;max-height:160px;border-radius:5px;border:1px solid var(--border);object-fit:contain;background:#f8f8f8">`;
      }
    })
    .catch(err => {
      console.error('[AuctionTracker] Image upload failed:', err);
      if (prev) prev.innerHTML = '';
      toast('⚠️ Could not upload that photo — check your connection');
    });
}

// Resizes an image file to fit within maxDim (longest side) and re-encodes
// as JPEG at the given quality, returning a Blob ready for Storage upload.
function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('encode failed')), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Uploads a Blob to the 'lot-images' Storage bucket and returns its public URL.
async function uploadBlobToStorage(blob) {
  const path = `${uuid()}.jpg`;
  const { error } = await sb.storage.from('lot-images').upload(path, blob, {
    contentType: 'image/jpeg', cacheControl: '3600', upsert: false
  });
  if (error) throw error;
  const { data } = sb.storage.from('lot-images').getPublicUrl(path);
  return data.publicUrl;
}

// Used only by the one-time legacy-data import: converts an old base64
// data: URL (from before the Storage migration) into a real uploaded photo.
async function uploadDataUrlToStorage(dataUrl) {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return uploadBlobToStorage(blob);
}

// ═══════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════
function badge(s) {
  const L = {pending:'Pending',won:'Won',transit:'Transit',arrival:'Arrival',archived:'Archived',lost:'Lost',passed:'Passed'};
  return `<span class="badge badge-${s}">${L[s]||s}</span>`;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return esc(s); }
function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); } catch(e) { return d; }
}

// INIT
// ═══════════════════════════════════════
render(); // initial loading screen while we check for a session

sb.auth.onAuthStateChange((event, session) => {
  const wasSignedIn = !!auth.user;
  auth.user = session?.user || null;
  auth.checked = true;
  auth.busy = false;

  if (auth.user && !wasSignedIn) {
    // Just signed in (fresh sign-in or session restored on page load)
    loadDataFromSupabase();
  } else if (!auth.user) {
    state.auctions = [];
    render();
  } else {
    render();
  }
});
